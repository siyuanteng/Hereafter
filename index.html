<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Hereafter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=VT323&family=Josefin+Sans:wght@200;300&family=Special+Elite&family=Overpass+Mono:wght@300;400;600;700&family=Caveat:wght@400;600&family=Indie+Flower&family=Shadows+Into+Light&family=Reenie+Beanie&family=Gochi+Hand&family=Nanum+Pen+Script&family=Kalam:wght@300;400&family=Homemade+Apple&display=swap" rel="stylesheet">
<style>
  :root { --cream:#fff3df; --amber:#ffd29a; --ink:#2a2420; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; overflow:hidden; background:#121420; color:var(--cream);
    font-family:"VT323", "Courier New", monospace; user-select:none; -webkit-user-select:none;
    touch-action:none; overscroll-behavior:none; -webkit-tap-highlight-color:transparent; }
  #c { position:fixed; inset:0; width:100vw; height:100vh; display:block; touch-action:none; }
  #flash { position:fixed; inset:0; pointer-events:none; opacity:0; mix-blend-mode:screen; }
  #fade { position:fixed; inset:0; pointer-events:none; opacity:0; background:#07060a; transition:opacity 1.6s ease; }
  #prompt { position:fixed; left:50%; bottom:4.5vh; transform:translateX(-50%); padding:8px 18px; border-radius:22px; background:rgba(20,18,24,.38);
    backdrop-filter:blur(4px); font-family:"VT323", "Courier New", monospace; font-size:17px; letter-spacing:.06em; opacity:0; transition:opacity .5s; pointer-events:none; white-space:nowrap; }
  #prompt.on { opacity:1; }
  #toast { position:fixed; left:50%; top:5vh; transform:translateX(-50%); max-width:80vw; text-align:center; font-family:"VT323", "Courier New", monospace; font-size:18px; line-height:1.7;
    padding:10px 22px; border-radius:10px; background:rgba(20,18,24,.34); backdrop-filter:blur(4px); opacity:0; transition:opacity .8s; pointer-events:none; }
  #toast.on { opacity:1; }
  #scope { position:fixed; inset:0; pointer-events:none; opacity:0; transition:opacity .7s; background:radial-gradient(circle at 50% 50%, rgba(0,0,0,0) 0, rgba(0,0,0,0) 31vmin, rgba(0,0,0,.55) 33vmin, rgba(8,7,6,.96) 34.5vmin, #050403 40vmin); }
  #scope::after { content:''; position:absolute; left:50%; top:50%; width:67vmin; height:67vmin; transform:translate(-50%,-50%); border-radius:50%; box-shadow: inset 0 0 6vmin rgba(0,0,0,.65), 0 0 0 1.2vmin rgba(40,34,30,.9); }
  #scope.on { opacity:1; }
  #help { position:fixed; right:18px; bottom:14px; font-size:12px; line-height:1.6; color:rgba(255,240,224,.5); letter-spacing:.03em; pointer-events:none;
    opacity:0; transition:opacity .6s; text-align:right; }
  #help.on { opacity:1; }
  #leave { position:fixed; right:22px; bottom:58px; font:inherit; font-size:14px; letter-spacing:.1em; padding:9px 18px; border-radius:20px; border:1px solid rgba(255,240,220,.4);
    background:rgba(20,18,24,.5); color:var(--cream); cursor:pointer; opacity:0; pointer-events:none; transition:opacity .4s; }
  #leave.on { opacity:1; pointer-events:auto; }
  @media (pointer:coarse) { #help { display:none; } }
  #eye { position:fixed; left:50%; bottom:13vh; transform:translateX(-50%); width:130px; height:76px; opacity:0; pointer-events:none; transition:opacity 1.4s; cursor:pointer; filter:drop-shadow(0 0 6px rgba(0,0,0,.5)); }
  #eye.on { opacity:.85; pointer-events:auto; animation:eyebreath 4s ease-in-out infinite; }
  @keyframes eyebreath { 0%,100% { transform:translateX(-50%) scale(1); } 50% { transform:translateX(-50%) scale(1.04); } }
  #eye svg { width:100%; height:100%; overflow:visible; }
  #eye .open { transition:transform .5s ease, opacity .3s .25s; transform-origin:60px 40px; }
  #eye.shut .open { opacity:0; }
  #eye.shut .open { transform:scaleY(0.04); }
  #eye .closed { opacity:0; transition:opacity .3s .4s; }
  #eye.shut .closed { opacity:1; }

  #start { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px; cursor:pointer;
    background:radial-gradient(ellipse at 50% 55%, rgba(10,10,20,0) 30%, rgba(10,10,20,.55) 100%); transition:opacity 1.4s; }
  #start h1 { margin:0; font-weight:400; font-size:clamp(56px,9vw,110px); letter-spacing:.06em; color:#fff6ea; font-family:"Special Elite", "Courier New", monospace; font-weight:400; padding-left:.06em; text-shadow:0 2px 18px rgba(0,0,0,.55); }
  #start .sub { font-size:16px; letter-spacing:.3em; color:rgba(255,232,205,.75); }
  #start .go { margin-top:22px; font-size:21px; letter-spacing:.42em; padding-left:.42em; color:#ffd9a6; animation:breathe 2.6s ease-in-out infinite; font-family:"Overpass Mono", monospace; font-weight:700; text-transform:uppercase; text-shadow:0 1px 10px rgba(0,0,0,.6); }
  #start .keys { margin-top:8px; font-size:14px; color:rgba(255,235,210,.82); letter-spacing:.14em; font-family:"Overpass Mono", monospace; font-weight:600; text-shadow:0 1px 8px rgba(0,0,0,.6); }
  @keyframes breathe { 0%,100%{opacity:.45} 50%{opacity:1} }
  #start.gone { opacity:0; pointer-events:none; }
</style>

const $ = id => document.getElementById(id);
const DEG = Math.PI / 180;
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (e0, e1, x) => { const t = clamp((x - e0) / (e1 - e0), 0, 1); return t * t * (3 - 2 * t); };
const angDiff = (a, b) => { let d = (a - b) % (2 * Math.PI); if (d > Math.PI) d -= 2 * Math.PI; if (d < -Math.PI) d += 2 * Math.PI; return d; };
const lerpAng = (a, b, t) => a + angDiff(b, a) * t;
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const rand = mulberry32(20261107);
const rr = (a, b) => a + (b - a) * rand();

/* =========================================================
   TERRAIN-START  地形（纯数学，不依赖 three）

function hash2(x, z) { const s = Math.sin(x * 127.1 + z * 311.7) * 43758.5453; return s - Math.floor(s); }
function vnoise(x, z) {
  const xi = Math.floor(x), zi = Math.floor(z), xf = x - xi, zf = z - zi;
  const u = xf * xf * (3 - 2 * xf), v = zf * zf * (3 - 2 * zf);
  const a = hash2(xi, zi), b = hash2(xi + 1, zi), c = hash2(xi, zi + 1), d = hash2(xi + 1, zi + 1);
  return (a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v) * 2 - 1;
}
function fbm(x, z) { return vnoise(x, z) * 0.6 + vnoise(x * 2.1 + 5.3, z * 2.1 + 3.1) * 0.3 + vnoise(x * 4.3 + 9.7, z * 4.3 + 1.3) * 0.1; }

const CAMP = { x: 0, z: 22 };
const PEAK = { x: -14, z: -56 };
const FOREST = { x: -34, z: -10 };
const POND = { x: 18, z: -24, r: 8.5 };
const FLOWERS = { x: 1e4, z: 1e4, r: 1 };     // 东边的花海：已经去掉（东边整块地裁掉了）
const DESERT = { x: -44, z: 36, r: 16 };     // 西南：一小片沙丘
const zoneW = (Z, x, z) => 1 - smooth(Z.r * 0.6, Z.r, Math.hypot(x - Z.x, z - Z.z));
const WF_TOP = { x: 12.5, z: -31.5 };

function baseH(x, z) {
  const r = Math.hypot(x, z), th = Math.atan2(z, x);
  // 每个方向上，岛有多远：从西边（-π）开始，每 45° 一个值：西、西北、北、东北、东、东南、南、西南、西
  const ISL = [70, 80, 92, 58, 48, 58, 66, 70, 70], fi = (th + Math.PI) / (Math.PI / 4), i0 = Math.min(7, Math.floor(fi)), ft = fi - i0, fs = ft * ft * (3 - 2 * ft);
  const R = lerp(ISL[i0], ISL[i0 + 1], fs) + 3 * Math.sin(3 * th + 1.0) + 2 * Math.sin(7 * th + 2.0);
  const shore = 1 - smooth(R - 24, R, r);
  let h = -4 + 7.2 * shore + fbm(x * 0.035, z * 0.035) * 3.2 * shore;
  const dp = Math.hypot(x - PEAK.x, z - PEAK.z);
  h += 27 * Math.exp(-(dp * dp) / (2 * 26 * 26)) * (0.85 + 0.15 * fbm(x * 0.08, z * 0.08));
  const dw = Math.hypot(x - WF_TOP.x, z - WF_TOP.z);
  h += 3.2 * Math.exp(-(dw * dw) / (2 * 4.5 * 4.5));            // 瀑布顶上的小崖
  // 西边的小山丘，让地形起伏更多一些
  const dh = Math.hypot(x + 46, z - 32); h += 5 * Math.exp(-(dh * dh) / (2 * 9 * 9));
  const dw2 = zoneW(DESERT, x, z); if (dw2 > 0) h += dw2 * shore * (0.9 * Math.sin(x * 0.21 + z * 0.12 + 1.3 * Math.sin(z * 0.09)) + 0.45 * Math.sin(x * 0.47 - z * 0.31) + 0.6);   // 沙丘的起伏
  return h;
}
const PONDL = baseH(POND.x, POND.z) - 0.6;   // 小湖的水面高度

/* 河：山泉 → 瀑布顶；小湖 → 东边的大湖。水面高度沿河只降不升 */
function makeRiver(pts, startLevel) {
  const S = [];
  for (let i = 0; i < pts.length - 1; i++) {
    const [ax, az] = pts[i], [bx, bz] = pts[i + 1]; const n = Math.ceil(Math.hypot(bx - ax, bz - az));
    for (let k = 0; k < n; k++) { const t = k / n; S.push({ x: ax + (bx - ax) * t, z: az + (bz - az) * t }); }
  }
  S.push({ x: pts[pts.length - 1][0], z: pts[pts.length - 1][1] });
  let lvl = startLevel;
  for (const s of S) { lvl = Math.min(lvl, baseH(s.x, s.z) - 0.5); s.w = lvl; }

  for (const s of S) { minx = Math.min(minx, s.x); maxx = Math.max(maxx, s.x); minz = Math.min(minz, s.z); maxz = Math.max(maxz, s.z); }
  return { S, box: [minx - 5, maxx + 5, minz - 5, maxz + 5] };
}
const RIVER_UP = makeRiver([[-3, -44], [3, -40], [9, -35], [WF_TOP.x, WF_TOP.z]], 1e9);

{ let lvl = 1e9; for (const s of RIVER_MID.S) { if (Math.hypot(s.x + 43, s.z + 20) < 7) s.w = Math.min(s.w, 6.4); lvl = Math.min(lvl, s.w); s.w = lvl; } }

    NB.position.set(0, -(1 - NOTE.vis) * 1.3, -0.95); NB.rotation.set(-0.06 - (1 - NOTE.vis) * 0.6, 0, 0.015);
    if (NOTE.reveal) { NOTE.reveal.t += dt; NOTE.dirty = true; const l = NOTE.poem.lines[NOTE.reveal.i]; if (NOTE.reveal.t * 34 > [...l].length + 8) NOTE.reveal = null; }
    drawNote();
  }

  // 拖动中的木头动画
  for (const l of LOGS.concat(PROPS)) if (l.anim) {
    l.anim.t += dt * 2.6; const u = smooth(0, 1, l.anim.t);

    l.obj.quaternion.slerpQuaternions(l.anim.fromQ, l.anim.toQ, u);
    if (l.anim.t >= 1) { const d = l.anim.done; l.anim = null; d && d(); }
  }
  const ghostOn = st === 'aligned' && G.tape === TAPE1 ? 1 : 0;
  GHOSTS.forEach((g, i) => {
    const sl = SLOTS[i];
    const target = (sl.filled || !sl.mine) ? 0 : ghostOn * (g.userData.hot ? 0.7 : 0.22 + 0.12 * Math.sin(G.time * 3 + i));

  });

  // 火、粒子、颜色晕染、环境
  pastFire.update(G.time, dt); nowFire.update(G.time + 1.7, dt); burst.update(dt);
  if (G.lit) { G.litRadius = Math.min(G.litRadius + dt * 9, 46); SHARED.uLit.value[0].z = G.litRadius; }
  G.warmSky = lerp(G.warmSky, G.warmSkyTarget, 1 - Math.exp(-dt * 0.6));

  camcorder.userData.led.visible = Math.sin(G.time * 4) > 0;
  if (!G.hasCam) { const br = 0.5 + 0.5 * Math.sin(G.time * 2.2); camcorder.userData.halo.material.opacity = 0.45 + 0.4 * br; camcorder.userData.halo.scale.setScalar(1.2 + 0.5 * br); camcorder.userData.beam.material.opacity = 0.22 + 0.18 * br; camcorder.position.y = S.y + 0.55 + 0.085 + 0.03 * Math.sin(G.time * 1.6); camcorder.rotation.y = 2.2 + 0.15 * Math.sin(G.time * 0.7); }   // 在树桩上轻轻地呼吸、晃一晃
  if (nextTape.visible) nextTape.userData.spr.material.opacity = 0.6 + 0.4 * Math.sin(G.time * 2.2);
  if (nextTapeStars.visible) { const b2 = 0.5 + 0.5 * Math.sin(G.time * 2.2); nextTapeStars.userData.spr.material.opacity = 0.75 + 0.25 * b2; nextTapeStars.userData.spr.scale.setScalar(2.4 + 0.8 * b2);
    if (!nextTapeStars.userData.beam) { const bm = new THREE.Sprite(new THREE.SpriteMaterial({ map: GLOW, color: 0xffe2b0, transparent: true, opacity: 0.4, depthWrite: false, blending: THREE.AdditiveBlending })); bm.scale.set(0.6, 6, 1); bm.position.y = 2.8; setLayer(bm, 2); nextTapeStars.add(bm); nextTapeStars.userData.beam = bm; spotGlow(nextTapeStars); }
    nextTapeStars.userData.beam.material.opacity = 0.28 + 0.2 * b2; }   // 山顶那一卷：更亮一点，头顶一道细细的光
  if (nextTape3.userData.pillar) { const allDone = [TAPE1, TAPE_CLIMB, TAPE2].every(t2 => t2.marks.every(m => m.done)), t4 = nextTape3.userData.tape;
    nextTape3.userData.pillar.visible = !!t4 && allDone && !G.seen.has(t4.label); }   // 湖边那道长长的光：前三卷都做完了才亮起来
  fireflies.update(G.time);
  for (const f of FLOW) f.tex.offset.y = (f.tex.offset.y + f.speed * dt) % 1;
  for (const m of WF.mists) { m.s.material.opacity = 0.12 + 0.08 * Math.sin(G.time * 0.8 + m.ph); }
  updateDog(dt);
  { const d = TENT_ITEMS.door; d.open = lerp(d.open, d.target, 1 - Math.exp(-dt * 4));
    d.doors.forEach((h) => { const { s: sd, hw: W, H: HH, z0 } = h.userData, g = 1.2 * d.open, o = 0.35 * d.open;   // 门帘：底边内角往外拉开，开口上窄下宽（底部约 2.4 米）
      h.matrix.set(1 - g / W, -sd * g / HH, 0, sd * g,  0, 1, 0, 0,  -o * sd / W, -o / HH, 1, z0 + o,  0, 0, 0, 1); h.matrixWorldNeedsUpdate = true; });
    d.rolls.forEach(r => { r.visible = false; }); }
  $('eye').classList.toggle('on', st === 'sit' && G.sit && G.sit.kind === 'bag' && G.sit.t > 3 && (!G.sit.slept || G.sleeping));
  sound.setSnore(st === 'sit' && dog.st.lie > 0.7 && Math.hypot(dog.st.x - player.x, dog.st.z - player.z) < 2.8 ? 1 : 0);
  TENT_ITEMS.mug.obj.userData.steam.material.opacity = 0.08 + 0.06 * Math.sin(G.time * 1.7);
  TENT_ITEMS.mug.obj.userData.steam.position.y = 0.2 + (G.time * 0.1 % 0.1);
  pondLife.update(G.time, dt, Math.hypot(player.x - POND.x, player.z - POND.z) < 30);
  chimney.update(dt);
  TRAIL.update(dt);
  LEAVES.update(dt, G.time);

  // 声音：火、水
  const fd = Math.hypot(player.x - C.x, player.z - C.z);
  const tapeFire = G.hasCam && G.tape === TAPE1 && G.camLower < 0.5 && G.t > 6.5 && G.t < 17 ? 0.16 : 0;
  sound.setFire(Math.max(nowFire.strength * clamp(1 - fd / 24, 0, 1), tapeFire));
  const dWF = Math.hypot(player.x - WF.pos.x, player.z - WF.pos.z), dRv = distRiver(player.x, player.z);
  sound.setWater(Math.max(clamp(1 - dWF / 40, 0, 1) * 1.0, clamp(1 - dRv / 18, 0, 1) * 0.45, clamp(1 - TRAIL.fallsDist() / 16, 0, 1) * 0.7));
  hudWarm.intensity = (0.15 + nowFire.strength * 2.4 * clamp(1 - fd / 14, 0, 1)) * (0.85 + 0.15 * Math.sin(G.time * 11));

  
  G.markerT += dt;
  marker.visible = false;
  if (toastTimer > 0) { toastTimer -= dt; if (toastTimer <= 0) $('toast').classList.remove('on'); }
  if (G.hasCam) updateTapeUI();
}

function render() {
  SHARED.uPast.value = 0; scene.fog.color.copy(FOG_PRESENT).lerp(FOG_DUSK, (1 - (G.night || 0)) * 0.75).lerp(FOG_NIGHT, (G.night || 0) * 0.7).lerp(FOG_PAST, G.warmSky * 0.4);

    skyPast.material.uniforms.uWarm.value = sameNight ? skyPresent.material.uniforms.uWarm.value : 1; PAST_NIGHT.value = sameNight ? SKY_NIGHT.value : 0.75;

  if (HUD.visible || NB.visible) {

}

window.__dbg = { G, TRAIL, TAPE_CLIMB, player, loadTape2, beginAlign, tapePose, L, cam, dog, update, render };   // 调试用
